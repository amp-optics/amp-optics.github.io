<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact AMP Optics — Optical Engineering Consulting Inquiries</title>
  <meta name="description" content="Start a conversation about your optical system. AMP Optics provides optical design, analysis and development consulting from San Diego, California.">
  <link rel="canonical" href="https://www.amp-optics.com/contact-us/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact — AMP Optics">
  <meta property="og:description" content="Tell us what you're building. We'll tell you what it will take to make it real.">
  <meta property="og:url" content="https://www.amp-optics.com/contact-us/">
  <meta property="og:image" content="https://www.amp-optics.com/assets/hero.jpg">
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=6">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="wordmark" href="/"><img src="/assets/logo-white.png" alt="">AMP<span>&nbsp;Optics</span></a>
      <nav>
        <a href="/">Welcome</a>
        <a href="/about-us/">About</a>
        <a href="/services/">Services</a>
        <a href="/publications/">Publications</a>
        <a href="/contact-us/" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <div class="page-head contact-head">
    <div class="section-inner">
      <div class="head-text">
        <h1>Contact</h1>
        <p>Tell us about your project — a few sentences is plenty to start. You can also reach out via <a href="https://www.linkedin.com/in/adam-phenis-612ab2/" rel="noopener" style="color:#fff">LinkedIn</a>.</p>
      </div>
      <div class="head-art" aria-hidden="true">
        <svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,270 Q40,260 80,270 T160,270 T240,270 T340,270" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"/>
          <line x1="150" y1="268" x2="150" y2="150" stroke="rgba(255,255,255,0.28)" stroke-width="7" stroke-linecap="round"/>
          <path d="M120,268 L150,220 L180,268" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M55,150 C55,85 115,45 180,52 C232,58 258,92 250,122" fill="none" stroke="#e3a13f" stroke-width="11" stroke-linecap="round"/>
          <g stroke="rgba(255,255,255,0.30)" stroke-width="3" stroke-linecap="round">
            <line x1="150" y1="150" x2="70" y2="128"/>
            <line x1="150" y1="150" x2="95" y2="80"/>
            <line x1="150" y1="150" x2="160" y2="58"/>
            <line x1="150" y1="150" x2="222" y2="70"/>
            <line x1="150" y1="150" x2="248" y2="112"/>
          </g>
          <circle cx="150" cy="150" r="8" fill="#0d1b26" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
          <line x1="150" y1="150" x2="150" y2="95" stroke="rgba(255,255,255,0.30)" stroke-width="4"/>
          <circle cx="150" cy="90" r="6" fill="rgba(255,255,255,0.35)"/>
          <g fill="none" stroke="#e3a13f" stroke-width="3" stroke-linecap="round" opacity="0.85">
            <path d="M175,70 A40,40 0 0 1 205,105"/>
            <path d="M188,52 A65,65 0 0 1 232,120"/>
            <path d="M200,32 A92,92 0 0 1 258,138"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <main class="content">
    <form id="contact-form" novalidate>
      <div class="field">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" autocomplete="organization">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="first-name">First Name <span class="req">(required)</span></label>
          <input type="text" id="first-name" name="first_name" required autocomplete="given-name">
        </div>
        <div class="field">
          <label for="last-name">Last Name <span class="req">(required)</span></label>
          <input type="text" id="last-name" name="last_name" required autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label for="email">Email Address <span class="req">(required)</span></label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="subject">Subject <span class="req">(required)</span></label>
        <input type="text" id="subject" name="subject" required>
      </div>

      <div class="field">
        <label for="message">Message <span class="req">(required)</span></label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <div class="field">
        <label for="password">Spam check &mdash; please enter the word &lsquo;Light&rsquo; <span class="req">(required)</span></label>
        <input type="text" id="password" name="spam_check" required autocomplete="off">
      </div>

      <!-- Honeypot: hidden from people, tempting to naive bots. Web3Forms
           rejects the submission server-side if this arrives checked. -->
      <input type="checkbox" name="botcheck" id="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">

      <button type="submit">Submit</button>
      <p class="form-status" id="form-status" role="status"></p>
    </form>
  </main>

  <footer>
    <div class="footer-inner">
      <span>&copy; AMP Optics, LLC &middot; San Diego, CA</span>
      <span><a href="/privacy/">Privacy Policy</a> &middot; <a href="https://www.linkedin.com/in/adam-phenis-612ab2/" rel="noopener">LinkedIn</a></span>
    </div>
  </footer>

  <script>
  (function () {
    // Form delivery via Web3Forms (https://web3forms.com — free tier).
    // Submissions go to the mailbox this key is registered to. The key is
    // public by design: it ships in this script and can only send mail to
    // that inbox. Manage it at https://app.web3forms.com.
    var WEB3FORMS_ACCESS_KEY = '0ebe4323-f9dd-4339-a13f-cf706d2d4920';

    var form = document.getElementById('contact-form');
    var statusEl = document.getElementById('form-status');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      statusEl.textContent = '';

      if (!form.checkValidity()) {
        statusEl.textContent = 'Please fill in all required fields.';
        return;
      }

      var answer = document.getElementById('password').value.trim().toLowerCase();
      if (answer !== 'light') {
        statusEl.textContent = "Please enter the word 'Light' in the spam check field.";
        return;
      }

      // Guard: Web3Forms accepts the placeholder key as a "test" and reports
      // success without delivering anything. Fail loudly until the real key is set.
      if (WEB3FORMS_ACCESS_KEY === 'YOUR_ACCESS_KEY_HERE') {
        statusEl.textContent = 'This form is not yet configured. Please reach out on LinkedIn instead.';
        return;
      }

      var data = {
        access_key: WEB3FORMS_ACCESS_KEY,
        subject: 'AMP Optics contact: ' + document.getElementById('subject').value,
        company: document.getElementById('company').value,
        name: document.getElementById('first-name').value + ' ' + document.getElementById('last-name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value,
        // Web3Forms defaults reply-to to `email`; set it explicitly so
        // hitting Reply on a notification always reaches the sender.
        replyto: document.getElementById('email').value,
        botcheck: document.getElementById('botcheck').checked
      };

      statusEl.textContent = 'Sending…';

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      }).then(function (res) { return res.json(); }).then(function (json) {
        if (json.success) {
          statusEl.textContent = 'Thank you — your message has been sent.';
          form.reset();
        } else {
          statusEl.textContent = 'Sorry, something went wrong. Please try again or reach out on LinkedIn.';
        }
      }).catch(function () {
        statusEl.textContent = 'Sorry, something went wrong. Please try again or reach out on LinkedIn.';
      });
    });
  })();
  </script>
</body>
</html>
